name: Deploy Routewise to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create TomTom runtime config
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          test -n "$TOMTOM_API_KEY"
          printf "%s\n" "// Generated during deployment. Do not commit this file." "window.ROUTEWISE_TOMTOM_API_KEY = '$TOMTOM_API_KEY';" > maps-config.js
      - name: Create live tracking runtime config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf "%s\n" "// Generated during deployment. Do not commit this file." "window.ROUTEWISE_SUPABASE_URL = '${SUPABASE_URL:-}';" "window.ROUTEWISE_SUPABASE_ANON_KEY = '${SUPABASE_PUBLISHABLE_KEY:-}';" > live-config.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
